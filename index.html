<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovoCommunicate (Klickdummy)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#3C0033;--bg1:#12000E;--plum:#5E0047;--berry:#8C1D6E;--lime:#C6D63F;--lime-ink:#26001D;
  --ink:#241F2C;--soft:#675E6E;--line:rgba(94,0,71,.12);--wash:#F7F1F5;
  --ok:#5FA81E;--warn:#FFB81C;--bad:#D32F2F;--info:#3B82C4;
  --f:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;--num:'Archivo Black','Montserrat',sans-serif;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{background:#12000E}
html,body{margin:0}
body{font-family:var(--f);color:#fff;min-height:100vh;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1400px 800px at 70% -10%,#5a0a4c 0%,transparent 60%),linear-gradient(180deg,var(--bg0),var(--bg1));background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:12px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:128px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:3px;padding:16px 0;z-index:30;
  background:linear-gradient(180deg,rgba(60,0,51,.72),rgba(26,0,20,.72));backdrop-filter:blur(18px) saturate(1.4);border-right:1px solid rgba(255,255,255,.1);overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.brand{font-weight:800;font-size:19px;letter-spacing:.02em;text-align:center;margin:6px 0 14px;line-height:1}.brand b{display:block;color:var(--lime);font-size:13px;letter-spacing:.04em;margin-top:3px}
.nav{position:relative;width:108px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 6px;border-radius:18px;font-size:12px;font-weight:700;text-align:center;color:rgba(255,255,255,.86);transition:all .18s var(--ease)}
.nav .ic{width:23px;height:23px}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:var(--lime);color:var(--lime-ink);box-shadow:0 10px 24px -10px rgba(198,214,63,.6)}
.nav .bdg{position:absolute;top:4px;right:18px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#FF5A5A;color:#fff;font-size:11px;display:grid;place-items:center}
.rail .sep{width:48px;height:1px;background:rgba(255,255,255,.14);margin:5px 0}
.main{padding:20px 32px 80px;width:100%;max-width:1500px}
.main.wide{max-width:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.8);min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.pill-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:700;white-space:nowrap}
.pill-btn:hover{background:rgba(255,255,255,.08)}
.agentpill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(198,214,63,.14);border:1px solid rgba(198,214,63,.45);font-size:13px;font-weight:700;color:var(--lime);white-space:nowrap}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(198,214,63,.7);animation:pl 1.8s infinite;flex:none}
@keyframes pl{70%{box-shadow:0 0 0 10px rgba(198,214,63,0)}100%{box-shadow:0 0 0 0 rgba(198,214,63,0)}}
.demo{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.75)}

/* ---------- Hero / Sektionen ---------- */
.hero{position:relative;border-radius:28px;padding:24px 28px 22px;background:var(--plum);border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 48px -32px rgba(0,0,0,.65);margin-bottom:24px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--lime)}
.hero h1{font-size:40px;line-height:1.05;margin:8px 0 8px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0 0 14px;color:rgba(255,255,255,.82);max-width:860px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.88);color:var(--ink);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.y{background:#FFE3A3;color:#5a3c00}.st.g{background:#D7EFC0;color:#1d4600}.st.b{background:#D6E7F7;color:#0b2a4a}.st.p{background:#EBD6E6;color:var(--plum)}.st.r{background:#F8D2D2;color:#7a0d0d}.st.n{background:#E9E6EC;color:#4a4450}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:800;font-size:14px;transition:all .18s var(--ease);white-space:nowrap}
.btn.lime{background:var(--lime);color:var(--lime-ink);box-shadow:0 12px 26px -12px rgba(198,214,63,.7)}
.btn.lime:hover{transform:translateY(-1px)}
.btn.lime:disabled{opacity:.45;transform:none;cursor:not-allowed}
.btn.ghost{border:1px solid rgba(255,255,255,.3);color:#fff}
.btn.line{border:1px solid var(--line);color:var(--plum);background:#fff}
.btn.dark{background:var(--plum);color:#fff}
.btn.red{background:#FBE3E3;color:#8a1010}
.btn.sm{padding:8px 14px;font-size:13px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 4px}
.sec h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.sub{margin:0 0 14px;color:rgba(255,255,255,.72);font-size:14px}
.card{background:#fff;color:var(--ink);border-radius:24px;padding:20px;box-shadow:0 18px 40px -28px rgba(0,0,0,.6)}
.card h3{margin:0 0 6px;font-size:16px;color:var(--plum);display:flex;gap:8px;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.muted{color:var(--soft);font-size:13px}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:18px;text-align:center;color:var(--soft);font-size:14px}

/* ---------- KPI-Band ---------- */
.kband{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:22px}
.kpi{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:16px 18px}
.kpi .l{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:7px}
.kpi .v{font-family:var(--num);font-size:34px;line-height:1.1;margin-top:6px}
.kpi .d{font-size:12px;color:var(--lime);font-weight:700}
.kpi.alert{background:rgba(255,90,90,.16);border-color:rgba(255,120,120,.5)}
.kpi.alert .d{color:#FFB3B3}

/* ---------- Kartentyp 1: Kampagne (weiß, Megafon-Kachel, Status-Badge) ---------- */
.tile{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none}
.tile .ic{width:24px;height:24px}
.sb{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap}
.sb .ic{width:17px;height:17px}
.sb.aktiv{background:#DDF1C9;color:#1d4600}.sb.pausiert{background:#FFE7AE;color:#5a3c00}.sb.geplant{background:#D9E8F8;color:#0b2a4a}.sb.abgeschlossen{background:#E9E6EC;color:#4a4450}
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.camp{position:relative;background:#fff;color:var(--ink);border-radius:24px;padding:18px 18px 16px;box-shadow:0 18px 40px -28px rgba(0,0,0,.6);cursor:pointer;transition:transform .18s var(--ease)}
.camp:hover{transform:translateY(-2px)}
.camp.abgeschlossen{opacity:.8}
.camp .hd{display:flex;gap:12px;align-items:flex-start}
.camp .tile{background:var(--plum);color:var(--lime)}
.camp.upd .tile{background:#0F4C81;color:#fff}
.camp .nm{font-weight:800;font-size:17px;line-height:1.25;color:var(--plum)}
.camp .grp{font-size:12.5px;color:var(--soft);margin-top:3px}
.camp .typ{display:inline-flex;gap:5px;align-items:center;font-size:11.5px;font-weight:700;color:var(--soft);margin-top:4px}
.camp .typ .ic{width:13px;height:13px}
.camp .stline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.chs{display:flex;gap:6px;flex-wrap:wrap}
.chi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.chi .ic{width:16px;height:16px}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.funnel div{background:var(--wash);border-radius:12px;padding:8px 8px 7px}
.funnel b{display:block;font-family:var(--num);font-size:19px;color:var(--plum);line-height:1.1}
.funnel span{font-size:10.5px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;border-radius:99px;background:#EEE6EC;overflow:hidden;margin-top:12px;display:flex}
.bar i{display:block;height:100%}
.camp .ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--soft);gap:8px}
.camp .ft span{display:flex;gap:6px;align-items:center}
.camp .ft .ic{width:14px;height:14px}
.camp .flag{display:inline-flex;gap:5px;align-items:center;background:#FFE1E1;color:#8a1010;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px}
.camp .flag .ic{width:13px;height:13px}
.verif{display:inline-flex;gap:5px;align-items:center;color:#1d4600;font-weight:700}
.spark{width:96px;height:30px;flex:none}

/* ---------- Kartentyp 2: Zielgruppe (dunkles Glas, Lime-Kreis) ---------- */
.gcat{margin-bottom:8px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gcard{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:10px}
.gcard .hd{display:flex;gap:12px;align-items:center}
.gcard .circ{width:48px;height:48px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;flex:none}
.gcard .circ .ic{width:24px;height:24px}
.gcard .nm{font-weight:800;font-size:16px;line-height:1.25}
.gcard .num{font-family:var(--num);font-size:34px;color:var(--lime);line-height:1}
.gcard .num small{font-family:var(--f);font-size:13px;color:rgba(255,255,255,.7);font-weight:600;margin-left:6px}
.gcard dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;font-size:13px}
.gcard dt{color:rgba(255,255,255,.6)}.gcard dd{margin:0;font-weight:600}
.gcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.gcard .grow{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:800;color:var(--lime)}
.gcard .grow .ic{width:14px;height:14px}
.catttl{display:flex;gap:10px;align-items:center}
.catttl .ic{color:var(--lime)}

/* ---------- Kartentyp 3: Kontakt (Zeile, runder Avatar) ---------- */
.rows{display:flex;flex-direction:column;gap:10px}
.ccard{background:#fff;color:var(--ink);border-radius:999px;padding:10px 12px 10px 10px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:14px;align-items:center;cursor:pointer;box-shadow:0 14px 30px -26px rgba(0,0,0,.6);transition:transform .15s var(--ease)}
.ccard:hover{transform:translateY(-1px)}
.lead{display:flex;gap:12px;align-items:center;min-width:0}
.av{position:relative;width:48px;height:48px;border-radius:50%;background:var(--wash);color:var(--plum);display:grid;place-items:center;flex:none;font-weight:800;font-size:15px}
.av .uic{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;border:2px solid #fff}
.av .uic .ic{width:11px;height:11px;stroke-width:2.5}
.ccard .t{font-weight:800;font-size:15px}
.ccard .s{font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .mid{display:flex;flex-wrap:wrap;gap:6px}
.ccard .rt{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.chevw{width:38px;height:38px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;flex:none}
.chevw .ic{width:18px;height:18px}
.ccard.dnc .av{background:#FBE3E3;color:#8a1010}
.gtag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--wash);color:var(--plum);white-space:nowrap}

/* ---------- Kartentyp 4: Vorlage (Papier, Lime) ---------- */
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.tcard{background:#FBFCF0;color:var(--ink);border-radius:8px 24px 24px 24px;padding:18px;box-shadow:0 18px 40px -28px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px;cursor:pointer}
.tcard .hd{display:flex;gap:12px;align-items:center}
.tcard .tile{background:var(--lime);color:var(--lime-ink);border-radius:12px}
.tcard .nm{font-weight:800;font-size:15px;color:var(--lime-ink)}
.tcard .pv{font-size:13px;color:#3d3644;background:#fff;border:1px dashed #D8DDA8;border-radius:12px;padding:10px 12px;max-height:96px;overflow:hidden;position:relative}
.tcard .pv::after{content:"";position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(transparent,#fff)}
.var{background:#EEF3C4;color:#3a4500;border-radius:6px;padding:0 4px;font-weight:700;font-size:.92em}
.tcard .ft{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--soft);align-items:center;flex-wrap:wrap}

/* ---------- Leitstand ---------- */
.board{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.feed{position:sticky;top:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:16px;max-height:calc(100vh - 40px);overflow:hidden;display:flex;flex-direction:column}
.feed h3{margin:0 0 10px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.feed ul{list-style:none;margin:0;padding:0;overflow:auto;scrollbar-width:none}
.feed ul::-webkit-scrollbar{display:none}
.feed li{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px;animation:fi .4s var(--ease)}
@keyframes fi{from{opacity:0;transform:translateY(-6px)}}
.feed li .fi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff}
.feed li .fi .ic{width:16px;height:16px}
.feed li small{display:block;color:rgba(255,255,255,.55);font-size:11.5px;margin-top:2px}
body.tv .rail,body.tv .top .hide-tv{display:none}
body.tv .app{grid-template-columns:minmax(0,1fr)}
body.tv .main{max-width:none;padding:24px 36px}
body.tv .camps{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
body.tv .board{grid-template-columns:minmax(0,1fr) 440px}

/* ---------- Werkzeuge ---------- */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border-radius:999px;padding:10px 16px;flex:1;min-width:220px}
.search input{border:0;outline:0;flex:1;min-width:0;background:none}
.fchip{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:700;white-space:nowrap}
.fchip.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.fchips{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Kontaktprofil ---------- */
.prof{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:18px;align-items:start}
.prof>div>.card+.card{margin-top:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:8px 0 0;font-size:14px}
.kv dt{color:var(--soft)}.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.chrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.chrow:last-child{border-bottom:0}
.chrow .v{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft)}
.mem{display:flex;gap:10px;padding:10px 12px;border-radius:14px;background:var(--wash);margin-top:8px;font-size:14px;align-items:flex-start}
.mem .ic{color:var(--plum);margin-top:1px}
.mem small{display:block;color:var(--soft);font-size:12px}
.plan{display:flex;gap:12px;padding:12px;border-radius:16px;border:1.5px dashed #C9B3C3;margin-top:8px;align-items:flex-start}
.plan .when{flex:none;min-width:84px;text-align:center;background:var(--plum);color:#fff;border-radius:12px;padding:6px 8px;font-weight:800;font-size:13px;line-height:1.2}
.plan .when small{display:block;font-weight:600;font-size:11px;opacity:.8}
.plan b{display:block;font-size:14px}
.plan .muted{font-size:12.5px;margin-top:2px}
.hist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.hist div{background:var(--wash);border-radius:14px;padding:10px}
.hist b{display:block;color:var(--plum);font-size:16px;font-family:var(--num);line-height:1.2}
.hist span{font-size:11.5px;color:var(--soft)}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.mod{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#DDF1C9;color:#1d4600}
.mod.no{background:#F1EEF3;color:#8B8292}
.ordrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ordrow:last-child{border-bottom:0}
.ordrow span:last-child{white-space:nowrap;color:var(--soft)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;margin-bottom:14px}
.ev .dot{position:absolute;left:-26px;top:4px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;border:3px solid #fff}
.ev .dot .ic{width:10px;height:10px;stroke-width:3}
.ev .meta{font-size:12px;color:var(--soft);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ev .bub{margin-top:5px;padding:11px 14px;border-radius:16px;font-size:14px;max-width:640px}
.ev.out .bub{background:var(--wash)}
.ev.in .bub{background:#EAF4DD}
.ev.sys .bub{background:none;padding:2px 0;font-weight:700;color:var(--plum);font-size:13px}
.ev.human .bub{background:#E3EEFA}
.delay{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;font-weight:700;color:#0b2a4a;background:#D9E8F8;padding:2px 8px;border-radius:999px}
.delay .ic{width:12px;height:12px}
.shotbtn{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:700;color:var(--plum);padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff}
.shotbtn .ic{width:14px;height:14px}
.dncbox{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:18px;background:#FBE3E3;color:#7a0d0d;font-weight:700;margin-bottom:16px}
.freq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}

.note .ic{flex:none;margin-top:1px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14px}
.chk input{margin-top:3px;accent-color:var(--plum);width:16px;height:16px;flex:none}
.formbar{position:sticky;bottom:16px;display:flex;justify-content:flex-end;gap:10px;padding:12px;border-radius:999px;background:rgba(18,0,14,.75);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14)}

/* ---------- Kanäle / MCP / Regeln ---------- */
.chcard{display:flex;gap:14px;align-items:flex-start}
.chcard .big{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none}
.chcard .big .ic{width:24px;height:24px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl code{font-family:Consolas,monospace;font-size:13px;color:var(--plum);background:var(--wash);padding:2px 6px;border-radius:6px;white-space:nowrap}
.rule{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.rule:last-child{border-bottom:0}
.rule>.ic{color:var(--plum);margin-top:2px}
.rule b{display:block}
.arch{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch;margin-top:6px}
.arch div{background:var(--wash);border-radius:16px;padding:12px;font-size:13px;text-align:center}
.arch b{display:block;color:var(--plum);margin-bottom:4px}
.pauses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.pause{background:#fff;color:var(--ink);border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.pause .tile{background:var(--plum);color:var(--lime)}
.pause.upd .tile{background:#0F4C81;color:#fff}
.pause b{display:block;font-family:var(--num);font-size:26px;color:var(--plum);line-height:1.1}
/* Kampagnenziele */
.purps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.purp{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;border:1.5px solid var(--line);cursor:pointer;background:#fff;text-align:left}
.purp .tile{width:40px;height:40px;border-radius:12px;background:var(--wash);color:var(--plum)}
.purp .tile .ic{width:20px;height:20px}
.purp b{display:block;color:var(--plum);font-size:14px;line-height:1.25}
.purp span{font-size:12px;color:var(--soft)}
.purp.on{border-color:var(--plum);background:var(--wash)}
.purp.on .tile{background:var(--plum);color:var(--lime)}
.explain{background:#F4F8DC;border-radius:18px;padding:16px;margin:4px 0 12px;font-size:14px;color:#2f3600}
.explain b{color:var(--lime-ink)}
.explain ol{margin:8px 0 0;padding-left:20px}.explain li{margin:4px 0}
.inl{display:flex;gap:8px;margin-top:8px}.inl input{flex:1;min-width:0}
.vpool{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.vpool div{background:var(--wash);border-radius:14px;padding:10px}
.vpool b{display:block;font-family:var(--num);font-size:20px;color:var(--plum);line-height:1.1}
.vpool span{font-size:11.5px;color:var(--soft)}
.vcodes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vcode{font-family:Consolas,monospace;font-size:12.5px;padding:4px 9px;border-radius:8px;background:#F4F8DC;color:#2f3600;border:1px dashed #C9D27A}
.vcode.used{background:#EEE9F0;color:#8B8292;text-decoration:line-through;border-color:#D6CFDA}
.vleft{display:inline-flex;gap:5px;align-items:center;font-weight:800;color:#5a3c00;background:#FFE7AE;padding:3px 9px;border-radius:999px}
/* E-Mail im HTML-Design */
.mail{background:#F2EEF1;padding:14px;border-radius:14px}
.mail .mw{max-width:520px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;font-size:14px;color:#241F2C;box-shadow:0 6px 18px -10px rgba(0,0,0,.3)}
.mail .mh2{background:#5E0047;color:#fff;padding:12px 18px;font-weight:800;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.mail .mh2 small{color:#C6D63F;font-weight:700;letter-spacing:.1em}
.mail .himg{height:110px;background:radial-gradient(120px 80px at 75% 40%,#C6D63F 0%,transparent 70%),linear-gradient(135deg,#8C1D6E,#3C0033);display:flex;align-items:flex-end;padding:12px 18px;color:#fff;font-weight:800;font-size:20px;line-height:1.15}
.mail .mb{padding:16px 18px}
.mail .mbtn{display:inline-block;margin-top:12px;background:#C6D63F;color:#26001D;font-weight:800;padding:10px 18px;border-radius:999px}
.mail .mf{padding:10px 18px;font-size:11px;color:#8B8292;border-top:1px solid #eee}
.tcard .mail{padding:8px;max-height:150px;overflow:hidden;pointer-events:none}
.tcard .mail .mw{transform:scale(.62);transform-origin:top left;width:161%}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.tabs button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--line);color:var(--plum)}
.tabs button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.code{width:100%;min-height:220px;font-family:Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);background:#FBFAFC}
.mform label.l{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:10px 0 6px}
.mform input,.mform select,.mform textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);background:#fff}
.mform textarea{min-height:90px}

/* ---------- Screenshot-Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(18,0,14,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.on{display:flex}
.mbox{background:#fff;color:var(--ink);border-radius:26px;padding:20px;width:min(760px,100%);max-height:92vh;overflow:auto}
.mbox .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.mbox .mh b{color:var(--plum);font-size:17px;display:flex;gap:8px;align-items:center}
.shot{border-radius:18px;overflow:hidden;border:1px solid #ddd;box-shadow:0 14px 30px -18px rgba(0,0,0,.4)}
.shot .bar2{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#fff;font-weight:700;font-size:14px}
.shot .body{padding:16px;min-height:160px}
.wa .bar2{background:#075E54}.wa .body{background:#ECE5DD}
.wa .msg{background:#DCF8C6;border-radius:10px 2px 10px 10px;padding:9px 12px;max-width:80%;margin-left:auto;font-size:14px;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.wa .msg small{display:block;text-align:right;color:#6b7b6b;font-size:11px;margin-top:3px}
.em .bar2{background:#0F4C81}.em .body{background:#fff;font-size:14px}
.em .hdr{border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:12px;font-size:13px;color:#555}
.li .bar2{background:#0A66C2}.li .body{background:#F3F2EF}
.li .msg,.ig .msg,.yt .msg,.pu .msg{background:#fff;border-radius:14px;padding:12px 14px;font-size:14px;max-width:85%}
.ig .bar2{background:linear-gradient(90deg,#833AB4,#C13584,#F77737)}.ig .body{background:#fafafa}
.ig .msg{background:#3797F0;color:#fff;margin-left:auto;border-radius:18px}
.yt .bar2{background:#E62117}.yt .body{background:#fff}
.yt .msg{border:1px solid #eee}
.pu .bar2{background:var(--plum)}.pu .body{background:linear-gradient(180deg,#3C0033,#12000E)}
.pu .msg{border-radius:18px}
.evid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-top:14px}
.evid dt{color:var(--soft)}.evid dd{margin:0;font-weight:600;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--lime);color:var(--lime-ink);padding:12px 20px;border-radius:999px;font-weight:800;font-size:14px;z-index:120;transition:all .25s var(--ease);box-shadow:0 14px 30px -10px rgba(0,0,0,.6);max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1300px){.board{grid-template-columns:minmax(0,1fr)}.feed{position:static;max-height:420px}.kband{grid-template-columns:repeat(3,minmax(0,1fr))}.arch{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){.prof,.inbox,.g2,.g3,.pauses{grid-template-columns:minmax(0,1fr)}.ccard{grid-template-columns:minmax(0,1fr) auto}.ccard .mid{display:none}.chtbl{grid-template-columns:minmax(0,1fr) auto}.chtbl .tp{grid-column:1/-1;margin-bottom:6px}}
@media (max-width:640px){
  html,body{overflow-x:clip}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px;overflow-x:auto;border-right:0;border-top:1px solid rgba(255,255,255,.1)}
  .brand,.rail .sep{display:none}.nav{width:76px;flex:none;font-size:10px;padding:6px 2px}.nav .ic{width:22px;height:22px}.nav .bdg{right:10px}
  .main{padding:14px 16px 110px}.main *{min-width:0}
  .hero{padding:20px 18px;border-radius:22px}.hero h1{font-size:28px}.hero .acts .btn{flex:1 1 100%;justify-content:center}
  .kband{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:26px}
  .camps,.gcards,.tcards{grid-template-columns:minmax(0,1fr)}
  .top .hide-m{display:none}
  .funnel b{font-size:16px}
  .freq,.hist{grid-template-columns:minmax(0,1fr)}
  .arch{grid-template-columns:minmax(0,1fr)}
  .tbl{font-size:13px}.tbl td,.tbl th{padding:8px 6px}
  .ccard{border-radius:22px}
  .orow{grid-template-columns:auto minmax(0,1fr)}.orow .chi{display:none}.orow .when{grid-column:2;text-align:left}
  .obar{border-radius:20px}
  .formbar{border-radius:20px;flex-wrap:wrap}.formbar .btn{flex:1;justify-content:center}
  .sub2{margin-left:0}
}
</style>
</head>

  <nav class="rail" id="rail"></nav>
  <main class="main" id="main"></main>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

let XLSXP=null;
function xlsxLib(){return XLSXP||(XLSXP=new Promise((ok,no)=>{if(window.XLSX)return ok(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>ok(window.XLSX);s.onerror=()=>{XLSXP=null;no()};document.head.appendChild(s)}))}
const XCOLS=['Vorname','Nachname','E-Mail','Telefon','Sprache','Anrede','Einwilligung E-Mail','Quelle'];
async function xlsSave(rows,name){try{const X=await xlsxLib(),ws=X.utils.aoa_to_sheet(rows),wb=X.utils.book_new();ws['!cols']=rows[0].map(()=>({wch:22}));X.utils.book_append_sheet(wb,ws,'Kontakte');X.writeFile(wb,name);return true}catch(e){toast('Excel-Bibliothek konnte nicht geladen werden');return false}}
const fname=s=>s.replace(/[^\wäöüÄÖÜß-]+/g,'_');
async function gExport(id){const g=G(id),rows=[['Name','E-Mail','Telefon','Sprache','Anrede','Einwilligung E-Mail','Status','Hinzugefügt durch','Weitere Zielgruppen']];
  gMembers(g).forEach(k=>{const em=k.ch.email?addrs(k.ch.email)[0]:null,wa=k.ch.whatsapp?addrs(k.ch.whatsapp)[0]:null;rows.push([k.name,em?em[0]:'',wa?wa[0]:'',LANGS[k.lang],k.anrede[0],k.dnc?'gesperrt':em&&em[1]?'ja':'nein',k.status[0],gBy(g,k),k.groups.filter(x=>x!==id).map(x=>G(x).name).join(', ')])});
  if(await xlsSave(rows,`Zielgruppe_${fname(g.name)}_${dday(0).split('.').reverse().join('-')}.xlsx`)){glog(g,'Daniel W.',`Excel-Export: ${rows.length-1} Kontakte (protokolliert)`);toast(`Export mit ${rows.length-1} Kontakten heruntergeladen – im Protokoll vermerkt`);render()}}
let GIMP=null;
function gImport(id){GIMP=null;const g=G(id);
  modal(`<div class="mh"><b>${ic('upload')} Excel in „${esc(g.name)}“ importieren</b><button class="btn line sm" onclick="closeModal()">${ic('x')} Schließen</button></div>
  <p class="muted" style="margin:0 0 10px">Excel (.xlsx) oder CSV. Erste Zeile = Spaltennamen. Erkannt werden u. a. ${XCOLS.join(', ')}. Bestehende Kontakte werden über die E-Mail erkannt und nicht doppelt angelegt.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><label class="btn dark sm" style="cursor:pointer">${ic('file-spreadsheet')} Datei wählen<input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="gImpRead('${id}',this.files[0])"></label><button class="btn line sm" onclick="xlsSave([XCOLS,['Maria','Muster','maria.muster@example.com','+43 660 0000000','Deutsch','Sie','ja','Messe Salzburg']],'Importvorlage_NovoCommunicate.xlsx')">${ic('download')} Leere Vorlage herunterladen</button></div>
  <div id="gimp"></div>`)}
const norm=s=>String(s||'').toLowerCase().replace(/[^a-zäöüß]/g,'');
function pick(r,...keys){for(const k of Object.keys(r)){const n=norm(k);if(keys.some(x=>n.includes(x)))return String(r[k]).trim()}return ''}
async function gImpRead(id,f){if(!f)return;const box=document.getElementById('gimp');box.innerHTML='<div class="empty">Datei wird gelesen …</div>';
  try{const X=await xlsxLib(),wb=X.read(await f.arrayBuffer()),rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
   const langOf=s=>{const n=norm(s);return Object.entries(LANGS).find(([c,l])=>n===c||norm(l)===n)?.[0]||'de'};
   const known=new Map();CONTACTS.forEach(k=>k.ch.email&&addrs(k.ch.email).forEach(a=>known.set(a[0].toLowerCase(),k)));
   const seen=new Set(),out=rows.map(r=>{const name=(pick(r,'vorname','firstname')+' '+pick(r,'nachname','lastname','surname')).trim()||pick(r,'name'),mail=pick(r,'mail').toLowerCase(),cons=/^(ja|yes|1|x|true|wahr)$/i.test(pick(r,'einwilligung','consent','optin'));
     const ok=!mail||/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(mail),dup=mail&&seen.has(mail);if(mail)seen.add(mail);
     return {name,mail,tel:pick(r,'telefon','phone','mobil'),lang:langOf(pick(r,'sprache','language')),an:/du/i.test(pick(r,'anrede'))?'Du':'Sie',cons,exist:known.get(mail),err:!name?'kein Name':!ok?'E-Mail ungültig':dup?'doppelt in der Datei':''}});
   GIMP={id,file:f.name,rows:out};const good=out.filter(r=>!r.err),ex=good.filter(r=>r.exist),nw=good.filter(r=>!r.exist),nc=good.filter(r=>!r.cons);
   box.innerHTML=`<div class="impst"><div><b>${out.length}</b><span>Zeilen</span></div><div><b>${nw.length}</b><span>neue Kontakte</span></div><div><b>${ex.length}</b><span>schon vorhanden</span></div><div><b>${out.length-good.length}</b><span>fehlerhaft</span></div></div>
    ${nc.length?`<div class="note" style="margin:10px 0">${ic('circle-alert')}<div>${nc.length} Person${nc.length>1?'en':''} ohne Einwilligung: werden aufgenommen, bekommen aber keine Werbe-E-Mails oder WhatsApp-Nachrichten.</div></div>`:''}
    <div class="gtbl imp">${out.slice(0,8).map(r=>`<div class="gr"><span><b>${esc(r.name||'–')}</b><span class="muted">${esc(r.mail||'keine E-Mail')} · ${LANGS[r.lang]} · ${r.an}</span></span>${r.err?`<span class="st r">${r.err}</span>`:r.exist?'<span class="st b">vorhanden – wird verknüpft</span>':r.cons?'<span class="st g">neu · Einwilligung</span>':'<span class="st n">neu · keine Einwilligung</span>'}</div>`).join('')}${out.length>8?`<div class="muted" style="padding:8px 0">… und ${out.length-8} weitere</div>`:''}</div>
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end"><button class="btn line sm" onclick="closeModal()">Abbrechen</button><button class="btn dark sm" ${good.length?'':'disabled'} onclick="gImpDo()">${ic('check')} ${good.length} Kontakte importieren</button></div>`}
  catch(e){box.innerHTML='<div class="note">'+ic('circle-alert')+'<div>Die Datei konnte nicht gelesen werden. Bitte als .xlsx oder .csv speichern.</div></div>'}}
function gImpDo(){const {id,file,rows}=GIMP,g=G(id),by=`Excel-Import „${file}“`;let n=0,l=0;
  rows.filter(r=>!r.err).forEach(r=>{if(r.exist){if(!r.exist.groups.includes(id)){r.exist.groups.push(id);(r.exist.gby=r.exist.gby||{})[id]=by;l++}}else{const k=newContact(r,id,by);if(r.tel)k.ch.whatsapp=[r.tel,0];n++}});
  g.n+=n+l;glog(g,'Daniel W.',`${by}: ${n} neu angelegt, ${l} bestehende verknüpft`);closeModal();toast(`${n+l} Kontakte importiert`);render()}

 +`<div class="grid g3">${Object.entries(CH).map(([k,c])=>`<div class="card chcard"><span class="big" style="background:${c[2]}">${ic(c[1])}</span><div style="min-width:0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h3 style="margin:0">${c[0]}</h3><span class="st ${c[4]==='verbunden'?'g':'n'}">${c[4]}</span></div><p class="muted" style="margin:6px 0 8px">${CHINFO[k]}</p>${c[4]==='verbunden'?`<div class="chips"><span class="st p">Screenshot ✓</span><span class="st p">Antworten ✓</span><span class="st p">${TPL.filter(t=>t.ch===k).length} Vorlagen</span></div>`:''}</div></div>`).join('')}</div>`;

/* ----- Regeln ----- */
P.rules=()=>topbar()+hero('Regeln','Was immer gilt','Diese Regeln gelten für alle Kampagnen. Die Plattform setzt sie technisch durch – eine Kampagne kann sie verschärfen, aber nicht lockern.',`<button class="btn lime" onclick="toast('Regeln bearbeiten (Demo)')">${ic('settings')} Bearbeiten</button>`)
 +`<div class="pauses">${Object.values(TYPES).map((t,i)=>`<div class="pause ${i?'upd':''}"><span class="tile">${ic(t.icon)}</span><div><span class="muted" style="font-weight:700">Kontaktpause ${t.name}</span><b>${t.pause} Tage</b><span class="muted">${t.desc}</span></div></div>`).join('')}</div>
 <div class="card">${RULES.map(r=>`<div class="rule">${ic(r[0])}<div><b>${r[1]}</b><span class="muted" style="font-size:14px">${r[2]}</span></div></div>`).join('')}</div>
  ${sec('Gesperrte Kontakte')}<div class="rows">${CONTACTS.filter(k=>k.dnc).map(contactCard).join('')}</div>`;

/* ===================== Router ===================== */
function render(keep){const h=(location.hash.slice(1)||'board').split('/');const page=P[h[0]]&&h[0]!=='board'?h[0]:'camps';
  const ae=document.activeElement,fid=keep&&ae&&ae.closest('#main')?[...document.querySelectorAll('#main input,#main textarea')].indexOf(ae):-1,pos=fid>=0?ae.selectionStart:0;
  const y=scrollY;
  renderRail({camp:'camps',contact:'contacts',group:'groups'}[page]||page);
  const m=document.getElementById('main');m.className='main'+(page==='board'?' wide':'');
  m.innerHTML=P[page](h[1]);
  if(page==='board')startFeed();
  if(keep){scrollTo(0,y);if(fid>=0){const el=document.querySelectorAll('#main input,#main textarea')[fid];if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}}
}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
/* ----- Rundgang: geht alle Seiten durch und erklärt sie ----- */
const TOUR=[
 {h:'camps',ic:'sparkles',t:'Willkommen bei NovoCommunicate',w:'Damit Novogenia mit tausenden Kunden, Resellern und Leads persönlich in Kontakt bleibt, ohne dass jemand jede Nachricht selbst schreiben muss. KI-Agenten erledigen die Routine, Menschen geben Aufträge und übernehmen heikle Fälle.',p:'Der Rundgang erklärt jede Seite: wofür sie da ist, was du dort siehst und zwei Beispiele aus dem Alltag.',ex:['Ein Endkunde hat vor 11 Monaten bestellt – der Agent erinnert ihn rechtzeitig an das Nachkaufen, in seiner Sprache.','Ein Reseller fragt nach einem Mengenpreis – das Gespräch landet bei einem Menschen, mit fertigem Antwortvorschlag.']},
 {h:'camps',sel:'.camps',ic:'megaphone',t:'Kampagnen',w:'Eine Kampagne ist ein Auftrag an einen Agenten: wen er anspricht, mit welchem Ziel und über welche Kanäle. Hier behältst du alle Aufträge im Blick.',p:'Jede Karte zeigt Owner, Ziel, Zielgruppe, Kanäle, Status und Fortschritt bis zum bestätigten Erfolg. Mit den Filtern siehst du z. B. nur deinen Agenten.',ex:['„Abo-Verlängerung“ (Owner Sandra M.): Kunden kurz vor Abo-Ende bekommen ein Angebot zur Verlängerung.','„LinkedIn-Reseller“ (Owner Daniel W.): neue Partner im DACH-Raum finden und zum Erstgespräch einladen.']},
 {h:'camp/perf',sel:'.kv',ic:'target',t:'Eine Kampagne im Detail',w:'Hier steht alles, was der Agent für diese Kampagne wissen muss – und woran man später sieht, ob sie funktioniert hat.',p:'Owner, Ziel, Auftrag, Angebot mit Gutscheinen, erlaubte und verbotene Kanäle, Erinnerungen und die Erfolgsprüfung im OrderManager.',ex:['Ziel „Upsell Performance-Paket“: Erfolg zählt erst, wenn die Bestellung im OrderManager bestätigt ist – nicht beim Klick.','Kanal-Regel: E-Mail und WhatsApp erlaubt, Anrufe verboten; nach 2 Erinnerungen ohne Antwort ist Schluss.']},
 {h:'new',sel:'.purps',ic:'plus',t:'Neue Kampagne anlegen',w:'Damit jede Person ihrem eigenen Agenten in wenigen Minuten einen neuen Auftrag geben kann – in eigenen Worten, ohne Technik.',p:'Du wählst Owner, Sprache und Ziel und beschreibst den Auftrag. Danach folgen Zielgruppe, Angebot, Kanäle, Vorlagen, Auftreten und Regeln.',ex:['„Schreib allen Kunden mit DNA-Test ohne Nahrungsergänzung und biete 15 % auf das passende Präparat an.“','„Finde Fitnessstudios in Bayern und lade sie zu einem Reseller-Gespräch ein – jede Nachricht vor dem Senden mir zur Freigabe.“']},
 {h:'groups',sel:'.gcard',ic:'users',t:'Zielgruppen',w:'Damit Kampagnen die richtigen Personen erreichen. Eine Zielgruppe ist eine Liste von Menschen mit gemeinsamem Merkmal.',p:'Sortiert in bestehende Kunden, bestehende Reseller und Kaltakquise. Kunden kommen aus OrderManager und NovoPilot, Kaltakquise-Gruppen füllt der Agent selbst.',ex:['„Kunden mit Abo-Ende in 30 Tagen“ – füllt sich jeden Tag automatisch neu.','„Ernährungsberater in Österreich“ – der Agent sucht öffentliche Profile und legt sie als Leads an.']},
 {h:'group/all-end',sel:'.gsync',ic:'refresh-cw',t:'Eine Zielgruppe verwalten',w:'Damit Zielgruppen aktuell und sauber bleiben – egal ob ein Agent sie über MCP angelegt hat oder ein Mensch.',p:'Beschreibung und Kurator, automatischer Abgleich mit OrderManager oder NovoPilot, Prüfliste für Vorschläge, Mitglieder hinzufügen oder entfernen, Excel importieren und exportieren, Änderungsprotokoll.',ex:['„Alle Endkunden“ wird jeden Morgen um 06:00 mit dem OrderManager abgeglichen: heute +23 neue Kunden, 4 entfernt wegen Widerspruch oder Sperre.','Hartlauer schickt eine neue Filialliste als Excel – importieren, Dubletten werden über die E-Mail erkannt und nur verknüpft.']},
 {h:'contacts',sel:'.ccard',ic:'contact',t:'Kontakte',w:'Damit jede Person nur einmal existiert – egal über wie viele Kanäle und Kampagnen sie erreicht wird. So wird niemand doppelt oder zu oft angeschrieben.',p:'Auf einen Blick: Sprache, letzter Kontakt, laufende Kampagnen und ob jemand gesperrt ist.',ex:['Eine Kundin ist in zwei Kampagnen – die Plattform sorgt dafür, dass sie trotzdem höchstens eine Nachricht pro Woche bekommt.','Jemand schreibt „bitte keine Werbung mehr“ – ein Klick sperrt alle Kanäle und Kampagnen.']},
 {h:'contact/k11',sel:'.chrow',ic:'user-round',t:'Ein Kontakt im Detail',w:'Damit Mensch und Agent vor jeder Nachricht wissen, was mit dieser Person schon passiert ist.',p:'Verlauf über alle Kanäle, Kaufhistorie, was sich der Agent gemerkt hat, Anrede, Sprache, Einwilligungen, persönlicher Kauflink und Kontaktplan.',ex:['Elena Rossi spricht Italienisch – der Agent schreibt ihr auf Italienisch, du liest den Verlauf auf Deutsch.','Der Agent hat sich gemerkt „pausiert Abo wegen Urlaub bis März“ und meldet sich erst danach wieder.']},
 {h:'templates',sel:'.tcard',ic:'file-text',t:'Vorlagen',w:'Damit Nachrichten einheitlich, geprüft und im Novogenia-Stil rausgehen – der Agent schreibt nicht jedes Mal bei null los.',p:'Vorlagen für E-Mail, WhatsApp, LinkedIn, Push und mehr. Der Agent setzt Name, Gutscheincode und Kauflink ein und übersetzt in jede Sprache.',ex:['Eine Willkommens-Mail auf Deutsch geschrieben – geht automatisch auch auf Ungarisch und Kroatisch raus.','Eine WhatsApp-Erinnerung mit Platzhalter {Gutscheincode} – jeder Kunde bekommt seinen eigenen Code.']},
 {h:'social',sel:'.socs.perfg',ic:'trending-up',t:'Social Media – Erfolge & Follower',w:'Damit man sieht, welche Plattform wirklich etwas bringt – nicht nur Likes, sondern Klicks und Bestellungen.',p:'Follower-Entwicklung, Reichweite, Engagement, Link-Klicks und Bestellungen je Plattform. Zeitraum oben umschalten: 7, 30 oder 90 Tage.',ex:['Instagram bringt die meisten neuen Follower, LinkedIn aber die meisten Reseller-Anfragen.','Ein YouTube-Video über Laktose hat 14 Bestellungen über seinen Gutscheincode ausgelöst.']},
 {h:'social',sel:'.week',ic:'calendar-days',t:'Social Media – Wochenplan',w:'Damit alle Kanäle regelmäßig bespielt werden, ohne dass jemand jeden Tag Posts schreiben muss.',p:'Der Agent plant und schreibt Posts für jede Plattform passend. Du gibst frei – einzeln oder alle auf einmal – und die Plattform veröffentlicht zum geplanten Zeitpunkt.',ex:['Ein Thema „Vitamin D im Winter“ wird zu LinkedIn-Fachpost, Instagram-Karussell und kurzem TikTok-Text.','Montagmorgen alle Posts der Woche durchsehen und mit „Alle freigeben“ in einer Minute einplanen.']},
 {h:'outbox',sel:'.obar',ic:'send',t:'Senden – KI entwirft, Mensch sendet',w:'Manche Kanäle erlauben keinen automatischen Versand oder sollen bewusst von einem Menschen kommen. Hier schreibt der Agent vor, du sendest.',p:'Du wählst einzelne oder alle Entwürfe aus und sendest direkt aus der Plattform. Absender, Zeitpunkt und ein Screenshot werden gespeichert.',ex:['20 LinkedIn-Nachrichten an neue Reseller-Kontakte: kurz drüberlesen, auswählen, senden.','Eine persönliche Nachricht an einen Großkunden: der Agent entwirft, du passt einen Satz an und sendest unter deinem Namen.']},
 {h:'inbox/k3',sel:'.reply',ic:'inbox',t:'Posteingang – hier antwortet ein Mensch',w:'Wenn ein Gespräch einen Menschen braucht, landet es hier – damit nichts liegen bleibt und niemand bei null anfangen muss.',p:'Zu jedem Gespräch liegt sofort ein KI-Vorschlag bereit. Anpassen, „Senden & nächstes“ – weiter. Tastatur: Strg + Enter sendet, Alt + → überspringt.',ex:['Ein Kunde beschwert sich über eine verspätete Lieferung – Vorschlag mit Entschuldigung und Gutschein, du sendest.','Eine medizinische Frage zu Medikamenten – der Agent antwortet bewusst nicht selbst, du entscheidest.']},
 {h:'forms/f1',sel:'.fsteps',ic:'clipboard-list',t:'Anfragen von den Websites',w:'Damit keine Formular-Anfrage von novogenia.com, novodaily.com oder novopilot.com verloren geht und jede schnell eine Antwort bekommt.',p:'Die Plattform filtert Spam, erkennt bestehende Kontakte, speichert die Einwilligung und ordnet jede Anfrage zu.',ex:['Eine Lohnherstellungs-Anfrage eines Supplement-Herstellers – geht mit fertigem Antwortvorschlag an einen Menschen.','Eine Newsletter-Anmeldung – der Agent trägt sie ein und bestätigt sie selbst.']},
 {h:'agent',sel:'.arch',ic:'bot',t:'Agent & MCP',w:'Hier sieht man, wie die Agenten arbeiten und wer welchen Agenten steuert – die Grundlage für Vertrauen und Kontrolle.',p:'Aufgabe holen, Kontext lesen, Regeln prüfen, senden, auswerten. Jede Person hat einen eigenen Agenten mit eigenem Schlüssel – er sieht nur die Kampagnen seines Owners.',ex:['Der Agent von Sandra M. arbeitet ihre 4 Kampagnen ab und sieht die von Daniel W. gar nicht.','Ein Schlüssel wird widerrufen – der betroffene Agent stoppt sofort, alle anderen laufen weiter.']},
 {h:'channels',ic:'plug',t:'Kanäle',w:'Damit klar ist, über welche Wege der Agent sprechen darf und ob jeder Weg gerade funktioniert.',p:'Alle Kanäle mit Status. Jede gesendete Nachricht wird als Screenshot gespeichert, jede Antwort erfasst.',ex:['LinkedIn zeigt „Neu verbinden“ – bis das erledigt ist, plant der Agent dort nichts.','WhatsApp ist verbunden – Nachrichten gehen nur an Kontakte mit Einwilligung.']},
 {h:'rules',ic:'shield-check',t:'Regeln',w:'Damit kein Agent zu oft, zur falschen Zeit oder ohne Erlaubnis schreibt. Die Plattform setzt diese Regeln technisch durch – der Agent kann sie nicht umgehen.',p:'Sperren, Kontaktpausen, Ruhezeiten, Einwilligung, Sprache, Gutscheine, Kennzeichnung als KI. Kampagnen können Regeln verschärfen, aber nie lockern.',ex:['Ruhezeit 20 bis 8 Uhr: eine um 22 Uhr geplante WhatsApp geht erst am nächsten Morgen raus.','Ein Agent schlägt 30 % Rabatt vor, erlaubt sind 15 % – die Plattform blockiert die Nachricht.']},
 {h:'camps',ic:'circle-check',t:'Fertig!',w:'Jetzt kennst du alle Seiten.',p:'Klick dich frei durch – alle Daten sind Demo-Daten, du kannst nichts kaputt machen. Den Rundgang startest du jederzeit wieder über „Rundgang“ oben rechts.'}
];
let TI=-1;
function tour(i){TI=i;closeModal();const st=TOUR[i];const go2=()=>setTimeout(tourDraw,location.hash==='#'+st.h?30:220);
  if(location.hash!=='#'+st.h){location.hash=st.h;go2()}else go2()}
function tourEnd(){TI=-1;document.querySelectorAll('.tspot,.tshade,.tcardw').forEach(e=>e.remove());try{localStorage.setItem('nc_tour_done','1')}catch(e){}}
function tourDraw(){if(TI<0)return;const st=TOUR[TI];document.querySelectorAll('.tspot,.tshade,.tcardw').forEach(e=>e.remove());
  const el=st.sel&&document.querySelector('#main '+st.sel);
  if(el){if(innerWidth<980){el.scrollIntoView({block:'start'});scrollBy(0,-12)}else el.scrollIntoView({block:'center'});const sp=document.createElement('div');sp.className='tspot';document.body.appendChild(sp);tourPos(sp,el)}
  else{scrollTo(0,0);const sh=document.createElement('div');sh.className='tshade';sh.onclick=tourEnd;document.body.appendChild(sh)}
  const c=document.createElement('div');c.className='tcardw';
  c.innerHTML=`<div class="tk"><span>Rundgang · ${TI+1} von ${TOUR.length}</span><button class="tx" onclick="tourEnd()">${ic('x')} Beenden</button></div>
   <h3>${ic(st.ic)} ${st.t}</h3><div class="tbody">${st.w?`<div class="twhy"><b>Wofür?</b> ${st.w}</div>`:''}<p>${st.p}</p>${st.ex?`<div class="tex">${st.ex.map((x,i)=>`<div><span>Beispiel ${i+1}</span>${x}</div>`).join('')}</div>`:''}</div>
   <div class="tdots">${TOUR.map((_,i)=>`<i class="${i===TI?'on':''}" onclick="tour(${i})" title="${TOUR[i].t}"></i>`).join('')}</div>
   <div class="tnav">${TI>0?`<button class="btn line sm" onclick="tour(${TI-1})">${ic('chevron-left')} Zurück</button>`:''}<span class="sp"></span>${TI<TOUR.length-1?`<button class="btn lime sm" onclick="tour(${TI+1})">${TI===0?'Los geht’s':'Weiter'} ${ic('chevron-right')}</button>`:`<button class="btn lime sm" onclick="tourEnd()">${ic('check')} Rundgang beenden</button>`}</div>`;
  document.body.appendChild(c)}
function tourPos(sp,el){const r=el.getBoundingClientRect(),p=8,vh=innerHeight,top=Math.max(8,r.top-p),bot=Math.min(vh-8,r.bottom+p);
  Object.assign(sp.style,{left:(r.left-p)+'px',top:top+'px',width:(r.width+2*p)+'px',height:Math.max(40,bot-top)+'px'})}
addEventListener('scroll',()=>{const sp=document.querySelector('.tspot'),st=TOUR[TI];if(sp&&st&&st.sel){const el=document.querySelector('#main '+st.sel);if(el)tourPos(sp,el)}},{passive:true});
addEventListener('resize',()=>{if(TI>=0)tourDraw()});
addEventListener('keydown',e=>{if(TI<0)return;if(e.key==='Escape')tourEnd();else if(e.key==='ArrowRight'&&TI<TOUR.length-1)tour(TI+1);else if(e.key==='ArrowLeft'&&TI>0)tour(TI-1)});
addEventListener('hashchange',()=>{if(TI>=0&&location.hash!=='#'+TOUR[TI].h)tourEnd()});
render();
{let done=false;try{done=localStorage.getItem('nc_tour_done')==='1'}catch(e){}if(!done)setTimeout(()=>tour(0),400)}
</script>
</body>
</html>
